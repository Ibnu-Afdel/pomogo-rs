[package]
name = "pomogo-rust"
version = "4.0.0"
edition = "2021"
authors = ["Ibnu Afdel"]
description = "A sleek, distraction-free Pomodoro timer TUI for Linux, Omarchy, and developers"
license = "MIT"

[[bin]]
name = "pomogo"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
clap = { version = "4.5", features = ["derive", "cargo"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
notify-rust = "4.11"
unicode-width = "0.2"
dirs = "5.0"
csv = "1.3"
arboard = "3.6.1"
signal-hook = "0.3"
libc = "0.2"

[dev-dependencies]
tempfile = "3.17"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
